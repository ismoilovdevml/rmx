[package]
name = "rmx"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
authors = ["Otabek Ismoilov <ismoilovdev@gmail.com>"]
description = "Fast alternative to rm command written in Rust"
license = "MIT"
repository = "https://github.com/ismoilovdevml/rmx"

[dependencies]
libc = "0.2"

[lib]
name = "rmx_lib"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

