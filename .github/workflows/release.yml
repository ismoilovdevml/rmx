name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # Linux musl builds (static binaries). rmx only depends on libc, so
          # every target builds natively on a matching runner -- no `cross`.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

          # Windows build (portable std-only engine)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/rmx* || true

      # No separate strip step: Cargo.toml sets `strip = true` for release.

      # The archive lands in the workspace root (three levels up), which
      # avoids passing a Windows path to bash.
      - name: Create archive
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/$TARGET/release"
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "../../../rmx-$TARGET.zip" rmx.exe
          else
            tar czf "../../../rmx-$TARGET.tar.gz" rmx
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmx-${{ matrix.target }}
          path: rmx-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          find artifacts \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          ls -lh ./*.tar.gz ./*.zip

      # `rmx upgrade` and install.sh refuse to install without this file.
      - name: Generate checksums
        run: |
          sha256sum rmx-*.tar.gz rmx-*.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 5
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rmx-*.tar.gz
            rmx-*.zip
            SHA256SUMS.txt
          body: |
            ## RMX ${{ github.ref_name }}

            ### 📥 Installation

            **Linux / macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            **Homebrew (macOS, Linux):**
            ```bash
            brew tap ismoilovdevml/rmx https://github.com/${{ github.repository }}
            brew install ismoilovdevml/rmx/rmx
            ```

            **Windows:** download `rmx-x86_64-pc-windows-msvc.zip`, unpack it and
            put `rmx.exe` on your `PATH`.

            ### 📦 Pre-built Binaries

            Download the appropriate binary for your platform:
            - `rmx-x86_64-unknown-linux-musl.tar.gz` - Linux x86_64 (static binary)
            - `rmx-aarch64-unknown-linux-musl.tar.gz` - Linux ARM64 (static binary)
            - `rmx-x86_64-apple-darwin.tar.gz` - macOS Intel
            - `rmx-aarch64-apple-darwin.tar.gz` - macOS Apple Silicon
            - `rmx-x86_64-pc-windows-msvc.zip` - Windows x86_64

            ### Verifying downloads

            `SHA256SUMS.txt` lists the SHA-256 of every archive. `install.sh` and
            `rmx upgrade` verify it automatically and refuse to install on a
            mismatch or if the file is missing. To check a manual download:
            ```bash
            sha256sum --ignore-missing -c SHA256SUMS.txt      # Linux
            shasum -a 256 --ignore-missing -c SHA256SUMS.txt  # macOS
            ```
            ```powershell
            Get-FileHash rmx-x86_64-pc-windows-msvc.zip -Algorithm SHA256  # Windows
            ```

            ### 🚀 What's Changed

            See commits for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The repository doubles as a Homebrew tap (Formula/rmx.rb). Point it at the
  # archives just published. main has no branch protection, so the workflow
  # token can push; the commit does not trigger other workflows.
  homebrew:
    name: Update Homebrew formula and AUR PKGBUILD
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D "$RUNNER_TEMP"

      - name: Regenerate formula
        run: scripts/update-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Regenerate AUR PKGBUILD
        run: scripts/update-aur.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/SHA256SUMS.txt" packaging/aur

      - name: Commit to main
        run: |
          if git diff --quiet -- Formula/rmx.rb packaging/aur && \
             [ -z "$(git status --porcelain -- packaging/aur)" ]; then
            echo "Formula and PKGBUILD already up to date"
            exit 0
          fi
          git diff -- Formula/rmx.rb packaging/aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rmx.rb packaging/aur
          git commit -m "[RELEASE] Update Homebrew formula and AUR PKGBUILD to $GITHUB_REF_NAME"
          git push origin HEAD:main

  aur:
    name: Publish to AUR
    needs: homebrew
    runs-on: ubuntu-latest
    # Opt-in: does nothing until the maintainer adds the AUR_SSH_PRIVATE_KEY
    # secret (the private key of an SSH key registered on aur.archlinux.org).
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout main
        if: env.AUR_KEY != ''
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Push PKGBUILD and .SRCINFO to the AUR
        if: env.AUR_KEY != ''
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^pkgname=//p' packaging/aur/PKGBUILD)
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$RUNNER_TEMP/aur"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          if [ -z "$(git status --porcelain)" ]; then
            echo "AUR already at this version"
            exit 0
          fi
          git config user.name "Otabek Ismoilov"
          git config user.email "ismoilovdev@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

      - name: Skipped
        if: env.AUR_KEY == ''
        run: echo "AUR_SSH_PRIVATE_KEY is not set; skipping AUR publish."
