name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # Linux musl builds (static binaries). rmx only depends on libc, so
          # every target builds natively on a matching runner -- no `cross`.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/rmx || true

      # No separate strip step: Cargo.toml sets `strip = true` for release.

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf rmx-${{ matrix.target }}.tar.gz rmx
          mv rmx-${{ matrix.target }}.tar.gz ${{ github.workspace }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmx-${{ matrix.target }}
          path: rmx-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          find artifacts -name "*.tar.gz" -exec mv {} . \;
          ls -lh ./*.tar.gz

      # `rmx upgrade` and install.sh refuse to install without this file.
      - name: Generate checksums
        run: |
          sha256sum rmx-*.tar.gz > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rmx-*.tar.gz
            SHA256SUMS.txt
          body: |
            ## RMX ${{ github.ref_name }}

            ### 📥 Installation

            **Linux (x86_64):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            **macOS (Intel/Apple Silicon):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### 📦 Pre-built Binaries

            Download the appropriate binary for your platform:
            - `rmx-x86_64-unknown-linux-musl.tar.gz` - Linux x86_64 (static binary)
            - `rmx-aarch64-unknown-linux-musl.tar.gz` - Linux ARM64 (static binary)
            - `rmx-x86_64-apple-darwin.tar.gz` - macOS Intel
            - `rmx-aarch64-apple-darwin.tar.gz` - macOS Apple Silicon

            ### Verifying downloads

            `SHA256SUMS.txt` lists the SHA-256 of every archive. `install.sh` and
            `rmx upgrade` verify it automatically and refuse to install on a
            mismatch or if the file is missing. To check a manual download:
            ```bash
            sha256sum --ignore-missing -c SHA256SUMS.txt      # Linux
            shasum -a 256 --ignore-missing -c SHA256SUMS.txt  # macOS
            ```

            ### 🚀 What's Changed

            See commits for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
