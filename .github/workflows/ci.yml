name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
        cache: true

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build debug
      run: cargo build --verbose

    - name: Build release
      run: cargo build --release --verbose

    # Unit tests plus the CLI integration tests in tests/.
    - name: Run unit and integration tests
      run: cargo test --release --verbose

    # Guards against dependency bloat creeping back (v0.7.0 was 1.8 MB, most
    # of it the HTTP/TLS/JSON stack that the upgrader no longer needs).
    - name: Check binary size
      run: |
        ls -lh target/release/rmx
        SIZE=$(stat -f%z target/release/rmx 2>/dev/null || stat -c%s target/release/rmx)
        LIMIT=1048576
        echo "Binary size: $SIZE bytes (limit: $LIMIT)"
        if [ "$SIZE" -gt "$LIMIT" ]; then
          echo "::error::Release binary is $SIZE bytes, above the $LIMIT byte limit"
          exit 1
        fi

    - name: Run functional test
      run: |
        mkdir -p /tmp/rmx-test
        for i in {1..100}; do
          dd if=/dev/urandom of="/tmp/rmx-test/file_$i.dat" bs=1024 count=10 2>/dev/null
        done

        echo "Testing rmx with -r flag..."
        ./target/release/rmx -r /tmp/rmx-test

        if [ ! -d /tmp/rmx-test ]; then
          echo "✅ Test passed: Directory deleted"
        else
          echo "❌ Test failed: Directory still exists"
          exit 1
        fi

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: true

    - name: Build release
      run: cargo build --release

    - name: Run quick benchmark
      run: |
        echo "🚀 Quick Performance Test"

        # Test 1: 1000 files × 100KB
        mkdir -p /tmp/bench1
        for i in {1..1000}; do
          dd if=/dev/urandom of="/tmp/bench1/file_$i.dat" bs=1024 count=100 2>/dev/null
        done

        echo "Testing RMX..."
        time ./target/release/rmx -rf /tmp/bench1

        echo "✅ Benchmark completed"

  install-script:
    name: Test Install Script
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check install scripts
      run: |
        bash -n install.sh
        bash -n uninstall.sh
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck install.sh uninstall.sh
        elif [ "$RUNNER_OS" = "Linux" ]; then
          echo "::error::shellcheck missing on Linux runner"
          exit 1
        fi